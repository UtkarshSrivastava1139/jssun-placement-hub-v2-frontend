openapi: 3.1.0
info:
  title: RADIX Talent Match API
  version: 1.0.0
  description: >-
    Proposed API contract for the five RADIX Talent Match roles. This is a planning
    contract; the implemented FastAPI service must publish matching OpenAPI.
servers:
  - url: http://localhost:8000
    description: Local development
security:
  - SupabaseBearer: []
paths:
  /api/v1/health:
    get:
      security: []
      summary: Health check
      responses:
        '200':
          description: Backend is ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, const: ok }
  /api/v1/jd-analytics/extract:
    post:
      summary: Extract skill requirements from a PDF, DOCX, or pasted-text job description and return a draft; do not persist until the user reviews it
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              anyOf:
                - required: [file]
                - required: [text]
              properties:
                file:
                  type: string
                  format: binary
                text:
                  type: string
                  minLength: 1
                  maxLength: 80000
                  description: Plain-text job description; provide this instead of file.
      responses:
        '200':
          description: Validated JD extraction draft
          content:
            application/json:
              schema:
                $ref: './schemas/jd-extraction-result.schema.json'
        '400':
          $ref: '#/components/responses/ClientError'
        '413':
          $ref: '#/components/responses/ClientError'
        '422':
          $ref: '#/components/responses/ClientError'
        '503':
          $ref: '#/components/responses/ServiceError'
  /api/v1/job-descriptions:
    get:
      summary: List saved JD extractions owned by the current user
      responses:
        '200':
          description: User-owned JD records
          content:
            application/json:
              schema:
                $ref: './schemas/job-description-list.schema.json'
        '401': { $ref: '#/components/responses/AuthError' }
    post:
      summary: Save a user-reviewed and schema-valid JD extraction draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/jd-extraction-result.schema.json'
      responses:
        '201':
          description: Saved JD record including its generated job_description_id
          content:
            application/json:
              schema:
                $ref: './schemas/saved-job-description-record.schema.json'
        '401': { $ref: '#/components/responses/AuthError' }
        '422': { $ref: '#/components/responses/ClientError' }
  /api/v1/job-descriptions/{job_description_id}:
    get:
      summary: Get one JD extraction owned by the current user
      parameters:
        - in: path
          name: job_description_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Saved JD extraction
          content:
            application/json:
              schema:
                $ref: './schemas/saved-job-description-record.schema.json'
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ClientError' }
    put:
      summary: Update a saved JD extraction after user review
      parameters:
        - in: path
          name: job_description_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/jd-extraction-result.schema.json'
      responses:
        '200':
          description: Updated saved JD extraction
          content:
            application/json:
              schema:
                $ref: './schemas/saved-job-description-record.schema.json'
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ClientError' }
        '422': { $ref: '#/components/responses/ClientError' }
  /api/v1/resume-parsing/extract:
    post:
      summary: Parse a PDF or DOCX resume into a candidate draft; do not store raw bytes
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Validated resume extraction draft; response is the ResumeExtractionResult itself
          content:
            application/json:
              schema:
                $ref: './schemas/resume-extraction-result.schema.json'
        '400': { $ref: '#/components/responses/ClientError' }
        '413': { $ref: '#/components/responses/ClientError' }
        '422': { $ref: '#/components/responses/ClientError' }
        '503': { $ref: '#/components/responses/ServiceError' }
  /api/v1/profile:
    get:
      summary: Load the current user's candidate profile
      responses:
        '200':
          description: Saved profile record; this endpoint returns 404 if the current user has not saved a profile yet
          content:
            application/json:
              schema:
                $ref: './schemas/saved-profile-record.schema.json'
        '404': { $ref: '#/components/responses/ClientError' }
        '401': { $ref: '#/components/responses/AuthError' }
    put:
      summary: Create or update the current user's candidate profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/candidate-profile.schema.json'
      responses:
        '200':
          description: Saved record envelope with stable server/database profile ID
          content:
            application/json:
              schema:
                $ref: './schemas/saved-profile-record.schema.json'
        '401': { $ref: '#/components/responses/AuthError' }
        '422': { $ref: '#/components/responses/ClientError' }
  /api/v1/profile/topics:
    get:
      summary: Load the read-only normalized RADIX topic catalog for the current Talent Match session
      responses:
        '200':
          description: Topic catalog grouped by canonical category and level
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [topics, warnings]
                properties:
                  topics:
                    type: array
                    items:
                      $ref: '#/components/schemas/TopicRecord'
                  warnings:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/AuthError' }
        '503': { $ref: '#/components/responses/ServiceError' }
  /api/v1/profile/topics/score:
    post:
      summary: Recompute a deterministic topic-based self-assessment recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [category_code, responses]
              properties:
                category_code:
                  $ref: './schemas/candidate-profile.schema.json#/$defs/categoryCode'
                responses:
                  type: array
                  items:
                    $ref: './schemas/candidate-profile.schema.json#/$defs/topicResponse'
      responses:
        '200':
          description: Explainable deterministic topic coverage and suggested level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicAssessmentResult'
        '401': { $ref: '#/components/responses/AuthError' }
        '422': { $ref: '#/components/responses/ClientError' }
        '503': { $ref: '#/components/responses/ServiceError' }
  /api/v1/talent-check:
    post:
      summary: Run deterministic company-level readiness scoring for the current user's saved profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_key]
              properties:
                company_key:
                  type: string
                  enum: [google, microsoft, oracle_fss]
      responses:
        '200':
          description: Readiness score and 12-category gap list
          content:
            application/json:
              schema:
                $ref: './schemas/talent-check-result.schema.json'
        '401': { $ref: '#/components/responses/AuthError' }
        '409': { $ref: '#/components/responses/ClientError' }
  /api/v1/skill-matching:
    post:
      summary: Run deterministic matching for the current user's saved profile and one saved JD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [job_description_id]
              properties:
                job_description_id: { type: string, format: uuid }
      responses:
        '200':
          description: Match score, confirmed matches, possible matches and missing requirements
          content:
            application/json:
              schema:
                $ref: './schemas/skill-match-result.schema.json'
        '401': { $ref: '#/components/responses/AuthError' }
        '404': { $ref: '#/components/responses/ClientError' }
        '409': { $ref: '#/components/responses/ClientError' }
  /api/v1/assessments:
    get:
      summary: List recent assessments owned by the current user
      responses:
        '200':
          description: Recent assessment summaries owned by the current user
          content:
            application/json:
              schema:
                $ref: './schemas/assessment-list.schema.json'
        '401': { $ref: '#/components/responses/AuthError' }
components:
  securitySchemes:
    SupabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase access token, including anonymous-auth sessions; identity is verified server-side.
  schemas:
    TopicRecord:
      type: object
      additionalProperties: false
      required: [topic_id, category_code, level_number, topic]
      properties:
        topic_id: { type: integer, minimum: 1 }
        category_code:
          $ref: './schemas/candidate-profile.schema.json#/$defs/categoryCode'
        level_number: { type: integer, minimum: 1, maximum: 10 }
        topic: { type: string, minLength: 1 }
    TopicAssessmentResult:
      type: object
      additionalProperties: false
      required:
        - scoring_version
        - suggested_level
        - status
        - explanation
        - coverage
        - answered_topic_count
        - total_topic_count
        - independent_topic_count
        - unanswered_topic_ids
      properties:
        scoring_version: { type: string, const: topic-self-assessment-v1 }
        suggested_level: { type: [integer, "null"], minimum: 1, maximum: 10 }
        status:
          enum: [suggested, insufficient_evidence, data_unavailable]
        explanation: { type: string }
        coverage:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [level, topic_count, answered_count, coverage_percent, unavailable]
            properties:
              level: { type: integer, minimum: 1, maximum: 10 }
              topic_count: { type: integer, minimum: 0 }
              answered_count: { type: integer, minimum: 0 }
              coverage_percent: { type: [number, "null"], minimum: 0, maximum: 100 }
              unavailable: { type: boolean }
        answered_topic_count: { type: integer, minimum: 0 }
        total_topic_count: { type: integer, minimum: 0 }
        independent_topic_count: { type: integer, minimum: 0 }
        unanswered_topic_ids:
          type: array
          items: { type: integer, minimum: 1 }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id, details]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            details:
              type: array
              items: { type: object }
  responses:
    ClientError:
      description: Invalid input or invalid state
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AuthError:
      description: Missing or invalid user token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServiceError:
      description: Extraction/model service unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
